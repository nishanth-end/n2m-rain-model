services:
  - type: web
    name: n2m-flood-prediction-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: MODE
        value: historical_replay
      - key: CORS_ORIGINS
        value: "*"
      - key: TELEGRAM_ENABLED
        value: "false"
