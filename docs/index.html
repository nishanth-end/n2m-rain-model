<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map — Predictive Flood Alert System</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="css/app.css" />
  <style>
    .map-viewport {
      display: flex;
      flex-direction: row;
      height: calc(100vh - 86px);
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #090b0e;
    }

    #map {
      flex: 1;
      height: 100%;
      background: #090b0e;
    }

    /* Floating / Docked Telemetry Console */
    .telemetry-sidebar {
      width: 410px;
      max-width: 100%;
      height: 100%;
      background: var(--surface-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 500;
    }

    .sidebar-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    .sidebar-title {
      font-size: 13px;
      font-family: var(--font-mono);
      font-weight: 600;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Zone Telemetry Cards */
    .zone-risk-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .zone-risk-card {
      background: var(--surface-elevated);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .zone-risk-card:hover {
      border-color: var(--accent);
      background: #1c2128;
      transform: translateX(2px);
    }

    .zone-risk-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .zone-risk-card-name {
      font-size: 12.5px;
      font-weight: 600;
      color: #ffffff;
    }

    .zone-risk-card-sub {
      font-size: 11px;
      font-family: var(--font-mono);
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* Minimalist Map Controls */
    .leaflet-control-container .leaflet-control {
      background: var(--surface-glass) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-sm) !important;
      color: var(--text) !important;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5) !important;
    }

    .leaflet-bar a {
      background: transparent !important;
      color: var(--text) !important;
      border-bottom: 1px solid var(--border) !important;
    }
    .leaflet-bar a:hover {
      background: rgba(255, 255, 255, 0.1) !important;
      color: var(--accent) !important;
    }

    .legend-control {
      padding: 10px 12px;
      font-size: 11.5px;
      line-height: 1.5;
    }

    .legend-header {
      font-size: 10px;
      font-family: var(--font-mono);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 6px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 3px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 3px;
      font-size: 11px;
    }

    .legend-pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .note-control {
      max-width: 260px;
      padding: 8px 12px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* Minimalist Sleek Popups */
    .leaflet-popup-content-wrapper {
      font-family: var(--font-sans) !important;
      background: var(--surface-glass) !important;
      backdrop-filter: blur(20px) !important;
      -webkit-backdrop-filter: blur(20px) !important;
      color: var(--text) !important;
      border: 1px solid var(--border) !important;
      border-radius: var(--radius-md) !important;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65) !important;
      padding: 2px !important;
    }

    .leaflet-popup-tip {
      background: var(--surface) !important;
    }

    .popup-title {
      font-weight: 600;
      font-size: 13.5px;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.01em;
    }

    .popup-row {
      font-size: 11.5px;
      margin: 3px 0;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }

    .popup-label {
      color: var(--text-muted);
      font-family: var(--font-mono);
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .top-contrib-list {
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
    }

    @media (max-width: 850px) {
      .map-viewport {
        flex-direction: column;
        height: auto;
      }
      #map {
        height: 480px;
      }
      .telemetry-sidebar {
        width: 100%;
        height: auto;
        border-left: none;
        border-top: 1px solid var(--border);
      }
    }
  </style>
</head>
<body>

  <!-- Persistent Warning Banner for Synthetic Data -->
  <div id="synthetic-banner-container"></div>

  <!-- Mapbox-Style Minimalist Floating Header -->
  <header class="site-header">
    <div class="brand-section">

      <div>
        <h1><a href="index.html">Predictive Flood Alert System</a></h1>
        <div class="brand-sub">BENGALURU GEO-INTELLIGENCE · TEAM N²M</div>
      </div>
    </div>
    <nav class="main-nav" aria-label="Main Navigation">
      <a href="index.html" class="active">Map</a>
      <a href="ml.html">ML Analysis</a>
      <a href="data.html">Data</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- Interactive Full-Bleed Map & Telemetry Console -->
  <div class="map-viewport">
    
    <!-- Map Canvas -->
    <div id="map" role="region" aria-label="Bengaluru Flood Hazard Map"></div>

    <!-- Right-Hand Telemetry Drawer -->
    <aside class="telemetry-sidebar" aria-label="Rainfall Scorer and Risk Rankings">
      
      <div>
        <div class="sidebar-header-row">
          <span class="sidebar-title">
            <span class="radar-dot" style="background:#38bdf8; box-shadow:0 0 6px #38bdf8;"></span>
            Rainfall Scenario
          </span>
          <button type="button" id="score-btn" class="btn btn-primary btn-sm">Score</button>
        </div>
        <p style="font-size:11px; color:var(--text-muted); margin:6px 0 10px 0; font-family:var(--font-mono);">
          10-day rainfall series (mm). Updates live or on click.
        </p>
        
        <!-- Reusable Rainfall Component Container -->
        <div id="rainfall-widget"></div>
      </div>

      <!-- Error banner -->
      <div id="error-container" style="display:none;" class="warning-callout"></div>

      <!-- Sorted Zones by Risk Panel -->
      <div>
        <div class="sidebar-header-row">
          <span class="sidebar-title">Vulnerability Ranking</span>
          <span id="zone-count-badge" style="font-size:10.5px; font-family:var(--font-mono); color:var(--text-muted);">8 ZONES</span>
        </div>
        <p style="font-size:11px; color:var(--text-muted); margin:4px 0 8px 0; font-family:var(--font-mono);">
          Select zone to pan and inspect telemetry:
        </p>
        <div id="zones-list" class="zone-risk-list">
          <div style="font-size:11.5px; color:var(--text-muted); padding:10px 0; font-family:var(--font-mono);">INITIALIZING SENSORS...</div>
        </div>
      </div>

    </aside>

  </div>

  <script src="js/common.js"></script>
  <script>
    let map = null;
    let zonesData = [];
    let predictionsMap = {};
    let markerLayerGroup = null;
    let zoneMarkers = {};
    let rainfallWidget = null;

    function initMap() {
      map = L.map('map', {
        zoomControl: true,
        attributionControl: true
      }).setView([12.945, 77.67], 11.4);

      // Standard OpenStreetMap tiles (100% free, zero API key required)
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 18,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      markerLayerGroup = L.layerGroup().addTo(map);

      // Mapbox-Style Minimalist Legend
      const legend = L.control({ position: 'bottomleft' });
      legend.onAdd = function () {
        const div = L.DomUtil.create('div', 'legend-control');
        div.innerHTML = `
          <div class="legend-header">Hazard Level</div>
          <div class="legend-row"><span class="legend-pip" style="background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,0.5);"></span> Severe Hazard</div>
          <div class="legend-row"><span class="legend-pip" style="background:#f97316; box-shadow:0 0 6px rgba(249,115,22,0.5);"></span> High Hazard</div>
          <div class="legend-row"><span class="legend-pip" style="background:#f59e0b; box-shadow:0 0 6px rgba(245,158,11,0.5);"></span> Moderate Hazard</div>
          <div class="legend-row"><span class="legend-pip" style="background:#10b981; box-shadow:0 0 6px rgba(16,185,129,0.5);"></span> Low Hazard</div>
          <div style="margin-top:6px; padding-top:4px; border-top:1px solid var(--border-subtle);">
            <div class="legend-row"><span style="display:inline-block; width:11px; height:11px; border-radius:50%; border:2px solid #ef4444;"></span> Documented Flood Zone</div>
            <div class="legend-row"><span style="display:inline-block; width:11px; height:11px; border-radius:50%; border:2px solid #10b981;"></span> Contrast Zone (Dry)</div>
          </div>
        `;
        return div;
      };
      legend.addTo(map);

      // Informational HUD Pill
      const note = L.control({ position: 'topright' });
      note.onAdd = function () {
        const div = L.DomUtil.create('div', 'note-control');
        div.innerHTML = "<span style='color:var(--accent); font-weight:600;'>REVIEW 3 INTELLIGENCE</span><br/>Live precipitation simulation feeding real-time XGBoost hazard engine. Rims show 2022 ground truth; fills reflect predicted index.";
        return div;
      };
      note.addTo(map);
    }

    async function loadZones() {
      const errBox = document.getElementById("error-container");
      errBox.style.display = "none";

      try {
        const data = await fetchAPI("/api/zones");
        zonesData = data.zones || [];
        await scoreAllZones();
      } catch (err) {
        console.error("Failed to load zones:", err);
        errBox.style.display = "flex";
        errBox.textContent = `API disconnected: ${err.message}.`;
        document.getElementById("score-btn").disabled = true;
      }
    }

    async function scoreAllZones() {
      const errBox = document.getElementById("error-container");
      errBox.style.display = "none";

      if (!rainfallWidget) return;
      const rainfall_10d = rainfallWidget.getValues();

      try {
        const res = await fetchAPI("/api/predict_all", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rainfall_10d })
        });

        predictionsMap = {};
        res.predictions.forEach(p => {
          predictionsMap[p.zone_id] = p;
        });

        updateMarkers();
        updateRankingList();
      } catch (err) {
        console.error("Scoring failed:", err);
        errBox.style.display = "flex";
        errBox.textContent = `Telemetry error: ${err.message}`;
      }
    }

    function updateMarkers() {
      markerLayerGroup.clearLayers();
      zoneMarkers = {};

      zonesData.forEach(z => {
        const pred = predictionsMap[z.id];
        const riskBand = pred ? pred.risk_band : "Unknown";
        const meta = getRiskBandMeta(riskBand);
        
        const borderColor = z.flooded ? '#ef4444' : '#10b981';
        const fillColor = meta.color;
        const radius = z.catchment ? Math.max(9, Math.min(24, Math.sqrt(z.catchment) * 2.5)) : 10;

        const marker = L.circleMarker([z.lat, z.lon], {
          radius: radius,
          color: borderColor,
          weight: 3,
          fillColor: fillColor,
          fillOpacity: 0.85
        }).addTo(markerLayerGroup);

        zoneMarkers[z.id] = marker;

        let popupHtml = `
          <div class="popup-title">${escapeHTML(z.name)}</div>
          <div class="popup-row">
            <span class="popup-label">Hazard Level:</span> 
            <span class="risk-badge ${meta.class}">${escapeHTML(riskBand)}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Risk Index:</span> 
            <span style="font-family:var(--font-mono); font-weight:600; color:#ffffff;">${pred ? pred.risk_score.toFixed(3) : 'N/A'}</span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Ground Truth:</span> 
            <span style="font-weight:600; color:${z.flooded ? '#f87171' : '#34d399'};">
              ${z.flooded ? 'Documented Flood' : 'Contrast (No Flood)'}
            </span>
          </div>
          <div class="popup-row">
            <span class="popup-label">Catchment Area:</span> 
            <span style="font-family:var(--font-mono);">${z.catchment ? z.catchment + ' km²' : 'Core Urban'}</span>
          </div>
          <div class="popup-row" style="flex-direction:column; gap:2px; margin-top:4px;">
            <span class="popup-label">Cause:</span>
            <span style="font-size:11px; color:var(--text-secondary);">${escapeHTML(z.cause)}</span>
          </div>
        `;

        if (pred && pred.top_contributions && pred.top_contributions.length > 0) {
          popupHtml += `
            <div class="top-contrib-list">
              <div class="popup-label" style="margin-bottom:4px;">Key Risk Drivers:</div>
              ${pred.top_contributions.map(c => `
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-family:var(--font-mono); font-size:10.5px;">
                  <span style="color:var(--text-muted);">${escapeHTML(c.feature)}</span>
                  <span style="color:${c.contribution >= 0 ? '#f87171' : '#34d399'};">
                    ${c.contribution >= 0 ? '+' : ''}${c.contribution.toFixed(3)}
                  </span>
                </div>
              `).join('')}
            </div>
          `;
        }

        marker.bindPopup(popupHtml);
      });
    }

    function updateRankingList() {
      const container = document.getElementById("zones-list");
      if (!container) return;

      const sorted = [...zonesData].sort((a, b) => {
        const scoreA = predictionsMap[a.id] ? predictionsMap[a.id].risk_score : -1;
        const scoreB = predictionsMap[b.id] ? predictionsMap[b.id].risk_score : -1;
        return scoreB - scoreA;
      });

      let html = "";
      sorted.forEach((z, idx) => {
        const pred = predictionsMap[z.id];
        const riskBand = pred ? pred.risk_band : "Unknown";
        const meta = getRiskBandMeta(riskBand);
        const scoreStr = pred ? pred.risk_score.toFixed(3) : "—";
        const isDocFlood = z.flooded === 1;

        html += `
          <div class="zone-risk-card" data-zone-id="${z.id}" tabindex="0" role="button" aria-label="${escapeHTML(z.name)}">
            <div class="zone-risk-card-header">
              <span class="zone-risk-card-name">${idx + 1}. ${escapeHTML(z.name)}</span>
              <span class="risk-badge ${meta.class}">${escapeHTML(riskBand)}</span>
            </div>
            <div class="zone-risk-card-sub">
              <span>Index: <strong style="color:#ffffff;">${scoreStr}</strong></span>
              <span>Truth: <strong style="color:${isDocFlood ? '#f87171' : '#34d399'};">${isDocFlood ? 'Flooded' : 'Dry'}</strong></span>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;

      container.querySelectorAll(".zone-risk-card").forEach(card => {
        const selectZone = () => {
          const zId = parseInt(card.getAttribute("data-zone-id"));
          const z = zonesData.find(item => item.id === zId);
          const marker = zoneMarkers[zId];
          if (z && marker) {
            map.setView([z.lat, z.lon], 13.5, { animate: true });
            marker.openPopup();
          }
        };

        card.addEventListener("click", selectZone);
        card.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            selectZone();
          }
        });
      });
    }

    document.addEventListener("DOMContentLoaded", () => {
      initMap();

      rainfallWidget = renderRainfallComponent("rainfall-widget", RAINFALL_PRESETS.storm.values, (values) => {
        scoreAllZones();
      });

      document.getElementById("score-btn").addEventListener("click", () => {
        scoreAllZones();
      });

      loadZones();
    });
  </script>
</body>
</html>
